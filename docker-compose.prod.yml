name: ${COMPOSE_PROJECT_NAME:-recruitment}

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in /opt/recruitment/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in /opt/recruitment/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /opt/recruitment/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in /opt/recruitment/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in /opt/recruitment/.env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    build:
      context: .
      dockerfile: docker/minio-client.Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in /opt/recruitment/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in /opt/recruitment/.env}
      PROFILE_STORAGE_BUCKET: ${PROFILE_STORAGE_BUCKET:-recruitment-documents}
      PROFILE_STORAGE_ACCESS_KEY: ${PROFILE_STORAGE_ACCESS_KEY:?Set PROFILE_STORAGE_ACCESS_KEY in /opt/recruitment/.env}
      PROFILE_STORAGE_SECRET_KEY: ${PROFILE_STORAGE_SECRET_KEY:?Set PROFILE_STORAGE_SECRET_KEY in /opt/recruitment/.env}
    volumes:
      - ./docker/minio-init.sh:/usr/local/bin/minio-init.sh:ro
    entrypoint: ["/usr/local/bin/minio-init.sh"]
    restart: "no"

  db-runtime-init:
    image: postgres:17
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./docker/db-runtime-init.sh:/usr/local/bin/db-runtime-init.sh:ro
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB in /opt/recruitment/.env}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER in /opt/recruitment/.env}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /opt/recruitment/.env}
      POSTGRES_RUNTIME_USER: ${POSTGRES_RUNTIME_USER:?Set POSTGRES_RUNTIME_USER in /opt/recruitment/.env}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Set POSTGRES_RUNTIME_PASSWORD in /opt/recruitment/.env}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
    entrypoint: ["/usr/local/bin/db-runtime-init.sh"]
    restart: "no"

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE to the GHCR image}:${IMAGE_TAG:?Set IMAGE_TAG to an immutable image tag}
    restart: unless-stopped
    environment:
      SPRING_FLYWAY_DEFAULT_SCHEMA: public
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      SPRING_FLYWAY_BASELINE_VERSION: ${SPRING_FLYWAY_BASELINE_VERSION:-0}
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?Set POSTGRES_DB in /opt/recruitment/.env}
      POSTGRES_USER: ${POSTGRES_RUNTIME_USER:?Set POSTGRES_RUNTIME_USER in /opt/recruitment/.env}
      POSTGRES_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?Set POSTGRES_RUNTIME_PASSWORD in /opt/recruitment/.env}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:?Set POSTGRES_USER in /opt/recruitment/.env}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in /opt/recruitment/.env}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Set JWT_SECRET_BASE64 in /opt/recruitment/.env}
      JWT_ISSUER: ${JWT_ISSUER:-groupcc2-recruitment}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-groupcc2-api}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-}
      APP_MAIL_POLL_INTERVAL_MS: ${APP_MAIL_POLL_INTERVAL_MS:-30000}
      PASSWORD_RESET_URL: ${PASSWORD_RESET_URL:-}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:-}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      SPRING_MAIL_AUTH: ${SPRING_MAIL_AUTH:-true}
      SPRING_MAIL_STARTTLS_ENABLE: ${SPRING_MAIL_STARTTLS_ENABLE:-true}
      PROFILE_STORAGE_ENABLED: ${PROFILE_STORAGE_ENABLED:-true}
      PROFILE_STORAGE_ENDPOINT: http://minio:9000
      PROFILE_STORAGE_PUBLIC_ENDPOINT: ${PROFILE_STORAGE_PUBLIC_ENDPOINT:?Set externally reachable PROFILE_STORAGE_PUBLIC_ENDPOINT in /opt/recruitment/.env}
      PROFILE_STORAGE_REGION: ${PROFILE_STORAGE_REGION:-us-east-1}
      PROFILE_STORAGE_BUCKET: ${PROFILE_STORAGE_BUCKET:-recruitment-documents}
      PROFILE_STORAGE_ACCESS_KEY: ${PROFILE_STORAGE_ACCESS_KEY:?Set PROFILE_STORAGE_ACCESS_KEY in /opt/recruitment/.env}
      PROFILE_STORAGE_SECRET_KEY: ${PROFILE_STORAGE_SECRET_KEY:?Set PROFILE_STORAGE_SECRET_KEY in /opt/recruitment/.env}
      PROFILE_DOWNLOAD_SECONDS: ${PROFILE_DOWNLOAD_SECONDS:-120}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-production}
      APP_OPENAPI_ENABLED: ${APP_OPENAPI_ENABLED:-false}
      APP_OPENAPI_PUBLIC: ${APP_OPENAPI_PUBLIC:-false}
      APP_RATE_LIMIT_ENABLED: ${APP_RATE_LIMIT_ENABLED:-true}
      APP_RATE_LIMIT_TRUSTED_PROXIES: ${APP_RATE_LIMIT_TRUSTED_PROXIES:-127.0.0.1,::1}
      APP_RATE_LIMIT_LOGIN_REQUESTS: ${APP_RATE_LIMIT_LOGIN_REQUESTS:-10}
      APP_RATE_LIMIT_LOGIN_WINDOW_SECONDS: ${APP_RATE_LIMIT_LOGIN_WINDOW_SECONDS:-900}
      APP_RATE_LIMIT_REGISTRATION_REQUESTS: ${APP_RATE_LIMIT_REGISTRATION_REQUESTS:-5}
      APP_RATE_LIMIT_REGISTRATION_WINDOW_SECONDS: ${APP_RATE_LIMIT_REGISTRATION_WINDOW_SECONDS:-3600}
      APP_RATE_LIMIT_RECOVERY_REQUESTS: ${APP_RATE_LIMIT_RECOVERY_REQUESTS:-5}
      APP_RATE_LIMIT_RECOVERY_WINDOW_SECONDS: ${APP_RATE_LIMIT_RECOVERY_WINDOW_SECONDS:-3600}
      APP_RATE_LIMIT_RESET_REQUESTS: ${APP_RATE_LIMIT_RESET_REQUESTS:-10}
      APP_RATE_LIMIT_RESET_WINDOW_SECONDS: ${APP_RATE_LIMIT_RESET_WINDOW_SECONDS:-3600}
      APP_RATE_LIMIT_UPLOAD_REQUESTS: ${APP_RATE_LIMIT_UPLOAD_REQUESTS:-20}
      APP_RATE_LIMIT_UPLOAD_WINDOW_SECONDS: ${APP_RATE_LIMIT_UPLOAD_WINDOW_SECONDS:-3600}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
      db-runtime-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-recruitment}_postgres_data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME:-recruitment}_minio_data
