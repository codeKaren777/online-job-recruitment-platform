spring:
  application:
    name: recruitment
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: recruitment
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: public
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH:true}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS_ENABLE:true}
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 6MB
springdoc:
  api-docs:
    enabled: ${app.openapi.enabled:false}
  swagger-ui:
    enabled: ${app.openapi.enabled:false}
server:
  port: 8080
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mail:
      enabled: false
  endpoint:
    health:
      show-details: never
      show-components: never
app:
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    trusted-proxies: ${APP_RATE_LIMIT_TRUSTED_PROXIES:127.0.0.1,::1}
    login:
      requests: ${APP_RATE_LIMIT_LOGIN_REQUESTS:10}
      window-seconds: ${APP_RATE_LIMIT_LOGIN_WINDOW_SECONDS:900}
    registration:
      requests: ${APP_RATE_LIMIT_REGISTRATION_REQUESTS:5}
      window-seconds: ${APP_RATE_LIMIT_REGISTRATION_WINDOW_SECONDS:3600}
    recovery:
      requests: ${APP_RATE_LIMIT_RECOVERY_REQUESTS:5}
      window-seconds: ${APP_RATE_LIMIT_RECOVERY_WINDOW_SECONDS:3600}
    reset:
      requests: ${APP_RATE_LIMIT_RESET_REQUESTS:10}
      window-seconds: ${APP_RATE_LIMIT_RESET_WINDOW_SECONDS:3600}
    upload:
      requests: ${APP_RATE_LIMIT_UPLOAD_REQUESTS:20}
      window-seconds: ${APP_RATE_LIMIT_UPLOAD_WINDOW_SECONDS:3600}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:}
    poll-interval-ms: ${APP_MAIL_POLL_INTERVAL_MS:30000}
  auth:
    password-reset-url: ${PASSWORD_RESET_URL:}
    bootstrap-admin:
      email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
      password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  openapi:
    enabled: ${APP_OPENAPI_ENABLED:false}
    public: ${APP_OPENAPI_PUBLIC:false}
    public-in-local: false
  security:
    cors:
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:*}
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: ${JWT_ISSUER:groupcc2-recruitment}
      audience: ${JWT_AUDIENCE:groupcc2-api}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT30M}

  profile:
    download-seconds: ${PROFILE_DOWNLOAD_SECONDS:120}
    storage:
      enabled: ${PROFILE_STORAGE_ENABLED:false}
      endpoint: ${PROFILE_STORAGE_ENDPOINT:http://localhost:9000}
      public-endpoint: ${PROFILE_STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
      region: ${PROFILE_STORAGE_REGION:us-east-1}
      bucket: ${PROFILE_STORAGE_BUCKET:recruitment-documents}
      access-key: ${PROFILE_STORAGE_ACCESS_KEY:}
      secret-key: ${PROFILE_STORAGE_SECRET_KEY:}
      path-style: true
