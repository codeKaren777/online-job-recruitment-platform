spring:
  application:
    name: recruitment
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: recruitment
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  servlet:
    multipart:
      enabled: false
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
app:
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: ${JWT_ISSUER:groupcc2-recruitment}
      audience: ${JWT_AUDIENCE:groupcc2-api}
