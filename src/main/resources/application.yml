spring:
  application:
    name: recruitment
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: recruitment
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    default-schema: public
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    locations: classpath:db/migration
    clean-disabled: true
    validate-on-migrate: true
  servlet:
    multipart:
      enabled: false
      max-file-size: 5MB
      max-request-size: 6MB
springdoc:
  api-docs:
    enabled: ${app.openapi.enabled:false}
  swagger-ui:
    enabled: ${app.openapi.enabled:false}
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
app:
  openapi:
    enabled: ${APP_OPENAPI_ENABLED:false}
    public-in-local: false
  security:
    jwt:
      secret-base64: ${JWT_SECRET_BASE64}
      issuer: ${JWT_ISSUER:groupcc2-recruitment}
      audience: ${JWT_AUDIENCE:groupcc2-api}

  profile:
    download-seconds: ${PROFILE_DOWNLOAD_SECONDS:120}
    storage:
      enabled: ${PROFILE_STORAGE_ENABLED:false}
      endpoint: ${PROFILE_STORAGE_ENDPOINT:http://localhost:9000}
      public-endpoint: ${PROFILE_STORAGE_PUBLIC_ENDPOINT:http://localhost:9000}
      region: ${PROFILE_STORAGE_REGION:us-east-1}
      bucket: ${PROFILE_STORAGE_BUCKET:recruitment-documents}
      access-key: ${PROFILE_STORAGE_ACCESS_KEY:}
      secret-key: ${PROFILE_STORAGE_SECRET_KEY:}
      path-style: true
