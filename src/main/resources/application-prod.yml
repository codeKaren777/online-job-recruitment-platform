spring:
  config:
    activate:
      on-profile: prod
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
app:
  mail:
    enabled: true
    from: ${APP_MAIL_FROM}
  openapi:
    enabled: ${APP_OPENAPI_ENABLED:false}
    public: ${APP_OPENAPI_PUBLIC:false}
    public-in-local: false
  rate-limit:
    enabled: true
  security:
    cors:
      # Empty disables cross-origin browser access; configure explicit origins if needed.
      allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
